name: Release

# Builds the desktop installers and the Docker image and publishes them as one
# GitHub release. Same process as Cutawan.
#
# Two ways to cut a release of the version in scripts/version.mjs:
#   1. `node scripts/version.mjs 0.2.0`, commit as "Release v0.2.0" and land it
#      on the default branch (handy when the environment can't push tags).
#   2. Push a version tag, e.g. `git tag v0.2.0 && git push --tags`.
# Either way the release tag (vX.Y.Z) comes from the version files, and the
# CHANGELOG.md section for that version becomes the release notes.
#
# Installers are built with --publish never and gathered here; the release
# stays a draft until every platform's installers and update manifests
# (latest*.yml) are uploaded and verified, then is published as Latest.
# The Docker image is pushed only after that, tagged with the version.
#
# Uses the built-in GITHUB_TOKEN, so no extra secrets are required.

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch: {}

concurrency:
  group: metachlorian-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  installers:
    # Only build/publish for a tag push, a manual dispatch, or a "Release v…"
    # commit to the default branch — every other push skips (a no-op run).
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref_name == github.event.repository.default_branch &&
       startsWith(github.event.head_commit.message, 'Release v'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      # Every release says what changed and ships one version; fail before spending build time.
      - name: Check version and release notes
        shell: bash
        run: |
          version=$(node scripts/version.mjs)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          node scripts/changelog-section.mjs "$version" --require > /dev/null
      - name: Build web app
        working-directory: app
        run: npm ci && npm run build
      - name: Build installers (unsigned until certificates are configured, see OPEN_QUESTIONS Q3)
        working-directory: desktop
        shell: bash
        env:
          # Signing: set CSC_LINK / CSC_KEY_PASSWORD (Windows, macOS) and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
          # APPLE_TEAM_ID (notarisation) as repository secrets, then remove "identity": null from package.json.
          # Until then macOS builds are ad-hoc signed by desktop/scripts/adhoc-sign-mac.mjs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci
          npm test
          npx electron-builder --publish never ${{ runner.os == 'macOS' && '--arm64' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  publish:
    name: publish complete release
    needs: installers
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install verifier dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Verify all platforms and publish together
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs release
          version=$(node scripts/version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/changelog-section.mjs "$version" --require > notes.md
          if gh release view "v$version" --json isDraft > release-state.json; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("This version is already published; bump the version before releasing.")'
          else
            gh release create "v$version" --draft --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
          fi
          gh release upload "v$version" release/* --clobber
          # A fresh draft has no public tag yet; resolve it through gh's draft-aware lookup.
          release_id=$(gh release view "v$version" --json databaseId --jq '.databaseId')
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > uploaded-release.json
          node scripts/verify-release.mjs release uploaded-release.json
          gh release edit "v$version" --target "$GITHUB_SHA" --notes-file notes.md --draft=false --latest

  image:
    name: publish Docker image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Block mappings: a ${{ }} expression inside a { } flow mapping is invalid YAML and stopped every run.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/jeremysnr/metachlorian:latest,ghcr.io/jeremysnr/metachlorian:v${{ needs.publish.outputs.version }},ghcr.io/jeremysnr/metachlorian:${{ needs.publish.outputs.version }}
