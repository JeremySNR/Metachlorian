name: CI
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv venv -p 3.11 core/.venv && uv pip install -p core/.venv/bin/python -e "core[analysis,dev]"
      - run: cd core && .venv/bin/python -m pytest -q
      - name: Shot-boundary benchmark (no external media needed)
        run: |
          core/.venv/bin/python - <<'PY'
          import subprocess, sys
          print("SBD gold set needs local footage; see eval/README.md")
          PY
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [core, app]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t metachlorian:ci .
