name: CI
on:
  push:
  pull_request:
    # labeled/unlabeled so adding "no release notes" re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  release-notes:
    name: release notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require CHANGELOG notes for app changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-release-notes.mjs
      - name: One version across core, app and desktop
        run: node scripts/version.mjs
  desktop:
    # Builds the self-contained desktop app for each platform and checks it runs with nothing else installed.
    # Pull requests only: it takes several minutes per platform.
    name: desktop app (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build web app
        working-directory: app
        run: npm ci && npm run build
      - name: Bundle and package
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci
          npm test
          npm run bundle
          npx electron-builder --dir ${{ runner.os == 'macOS' && '--arm64' || '' }}
      - name: Check the packaged app works on its own
        working-directory: desktop
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a --server-args="-screen 0 1600x1000x24"' || '' }} node scripts/check-package.mjs
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv venv -p 3.11 core/.venv && uv pip install -p core/.venv/bin/python -e "core[analysis,dev]"
      # Fails under the coverage floor in core/pyproject.toml ([tool.coverage.report] fail_under).
      - run: cd core && .venv/bin/python -m pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: core/coverage.xml, if-no-files-found: ignore }
      - name: Quality gates on synthetic media (shot boundaries, camera motion, query parser)
        run: core/.venv/bin/python eval/ci_gates.py --json ci-gates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-gates, path: ci-gates.json, if-no-files-found: ignore }
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [core, app]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t metachlorian:ci .


  design-foundations:
    name: shared design token export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 design-system/build.py --output app/src/styles/family-foundations.css --check
