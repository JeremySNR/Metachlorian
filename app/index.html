<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Metachlorian</title>
    <script>
      // Apply the saved theme and display settings before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('mc.prefs') || '{}').state || {};
        var h = document.documentElement;
        if (s.theme && s.theme !== 'system') h.dataset.theme = s.theme;
        if (s.density && s.density !== 'default') h.dataset.density = s.density;
        if (s.motion && s.motion !== 'system') h.dataset.motion = s.motion;
        if (s.contrast === 'more') h.dataset.contrast = 'more';
        if (s.textSize) h.style.fontSize = s.textSize + '%';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
