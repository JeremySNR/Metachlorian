[project]
name = "metachlorian"
version = "0.1.0"
description = "Self-hostable video library that understands every shot. Headless core: ingest, analysis, search, REST API and MCP server."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Metachlorian contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.19",
  "usearch>=2.12",
  "httpx>=0.27",
  "watchfiles>=0.22",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "opentimelineio>=0.17",
  "jsonschema>=4.22",
  "pillow>=10",
  "sentencepiece>=0.2",
  "mcp>=1.10",
]

[project.optional-dependencies]
# Heavier local analysers. Installed by default by scripts/install.sh; each one
# degrades gracefully (the analyser reports "unavailable") when missing.
analysis = [
  "scenedetect>=0.6.4",
  "sherpa-onnx>=1.12",
  "rapidocr-onnxruntime>=1.4",
  "mediapipe>=0.10.14",
]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "moto[server]>=5", "boto3>=1.34"]

[project.scripts]
metachlorian = "metachlorian.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metachlorian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
