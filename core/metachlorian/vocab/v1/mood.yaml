vocabulary: mood
version: 1.0.0
description: >
  The emotional tone a shot or segment conveys to a typical viewer, combining
  picture and sound. Each term has a nominal position on Russell's
  valence/arousal circumplex (valence -1..1 = unpleasant..pleasant, arousal
  -1..1 = calm..excited). The indexer also stores continuous valence and
  arousal scores, so "something upbeat but not frantic" can be answered
  numerically and the labels stay a coarse layer. Mood is subjective. Store
  confidence and allow up to three terms per shot.
multi: true
ordered: false
applies_to: [shot, segment, asset]
extensible: true
terms:
  - id: joyful
    label: Joyful
    valence: 0.9
    arousal: 0.5
    definition: Happy, cheerful and light-hearted.
    synonyms: [happy, cheerful, upbeat, fun, celebratory, festive, delighted, bright]
    broader: null
    mappings: {movielabs: null, iptc: null}
